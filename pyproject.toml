[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "sequence-native"
version = "0.2.0"
requires-python = ">=3.10"

[tool.maturin]
manifest-path = "native/Cargo.toml"
module-name = "sequence_native"
include = ["BoardDesign.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
